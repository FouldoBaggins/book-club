<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Club</title>
<!-- Installable app (PWA) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book Club">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* Theme: "auto" follows the phone; "light" / "dark" are this phone's own choice. */
const THEME_BAR = { light: "#f6f1e7", dark: "#1c1916" };
function applyTheme(choice){
  const root = document.documentElement;
  if (choice === "light" || choice === "dark") root.dataset.theme = choice; else delete root.dataset.theme;
  // top bar colour: match the chosen theme, or follow the phone on "auto"
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
    const media = m.dataset.media || m.getAttribute("media"); m.dataset.media = media;
    if (choice === "light" || choice === "dark"){ m.removeAttribute("media"); m.content = THEME_BAR[choice]; }
    else { m.setAttribute("media", media); m.content = media.includes("dark") ? THEME_BAR.dark : THEME_BAR.light; }
  });
}
try { applyTheme(localStorage.getItem("bc_theme") || "auto"); } catch(e){}
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ---------- Theme ---------- */
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#2a2420; --muted:#7a6f66; --line:#e6dccb;
  --accent:#b5532f; --accent-soft:#f3dfd3; --green:#2f6b4f; --green-soft:#dcebe2;
  --star:#e2a227; --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.07); --r:16px;
}
/* Dark colours: used when this phone chose "Dark", or chose "Auto" and the phone is in dark mode */
:root[data-theme="dark"]{--paper:#1c1916;--card:#26221e;--ink:#f1ebe2;--muted:#a99d91;--line:#3a342e;
  --accent:#e07a52;--accent-soft:#4a2e22;--green:#6fbf95;--green-soft:#22382d;--shadow:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--paper:#1c1916;--card:#26221e;--ink:#f1ebe2;--muted:#a99d91;--line:#3a342e;
  --accent:#e07a52;--accent-soft:#4a2e22;--green:#6fbf95;--green-soft:#22382d;--shadow:0 2px 10px rgba(0,0,0,.35);color-scheme:dark}
}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
.hidden{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 110px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header h1{font-size:26px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{border:0;background:transparent;padding:6px;border-radius:10px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--line)}
.status{background:var(--accent-soft);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}

/* ---------- Passcode screen ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:20px}
.gate-card{background:var(--card);border-radius:22px;padding:28px 22px;box-shadow:var(--shadow);width:100%;max-width:360px;text-align:center}
.gate-card h1{font-size:26px;margin:8px 0 6px}
.gate-card p{color:var(--muted);margin:0 0 16px}
.err{color:#b3261e;font-size:13px;min-height:18px;margin-top:6px}

/* ---------- Top cards ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media (max-width:520px){.hero{grid-template-columns:1fr}}
.hero-card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;min-height:86px}
.hero-card .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero-card .big{font-family:Fraunces,serif;font-size:20px;font-weight:700}
.hero-card .sub{font-size:13px;color:var(--muted)}
#meetIco{background:transparent}
.upnext{display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;margin-top:10px;padding:8px 10px;border:0;border-radius:12px;background:var(--card);text-align:left;cursor:pointer;color:var(--ink)}
.upnext .un-lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.upnext .un-title{font-family:Fraunces,serif;font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px}
.upnext .un-sub{font-size:12px;color:var(--muted)}
.hero-card.turn{background:linear-gradient(135deg,var(--green-soft),var(--card))}
.hero-card.meet{background:linear-gradient(135deg,var(--accent-soft),var(--card));cursor:pointer}
.hero-ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none;background:var(--card)}
.mini-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}

/* ---------- Tabs, stats, filters ---------- */
.tabs{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:999px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;padding:8px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.stat .n{font-family:Fraunces,serif;font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .t{font-size:12px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.genres{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.genres button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.genres button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- Sort / view toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sort-sel{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;font-size:13px}
.view-toggle{display:flex;background:var(--line);border-radius:999px;padding:3px}
.view-toggle button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600}
.view-toggle button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- List view ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.lrow{display:flex;align-items:center;gap:12px;background:var(--card);border:0;border-radius:14px;padding:8px 12px 8px 8px;box-shadow:var(--shadow);text-align:left;cursor:pointer;width:100%}
.lrow .lcv{width:44px;flex:none;border-radius:6px;overflow:hidden}
.lrow .lcv .gen-cover{padding:4px} .lrow .lcv .gt{font-size:8px} .lrow .lcv .ga{display:none}
.lrow .lmain{flex:1;min-width:0}
.lrow .lt{font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .la{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lside{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.gtags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.gtags .tag{font-size:11px;padding:1px 7px}

.menu-item{border:0;cursor:pointer;text-align:left;width:100%;padding:12px}
/* ---------- Fold-out section (scores) ---------- */
.fold{margin-top:10px}
.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;background:var(--green-soft);color:var(--green);font-weight:600;padding:11px 14px;border-radius:14px;cursor:pointer;user-select:none}
.fold summary::-webkit-details-marker{display:none}
.fold[open] summary{border-radius:14px 14px 0 0}
.fold .chev{transition:transform .2s}
.fold[open] .chev{transform:rotate(180deg)}

/* ---------- Genre picker ---------- */
.gpick{display:flex;flex-wrap:wrap;gap:6px}
.gpick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.gpick button.on{background:var(--green);color:#fff;border-color:var(--green)}

/* ---------- Book grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.book{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;border:0;padding:0;text-align:left;display:flex;flex-direction:column}
.book:active{transform:scale(.98)}
.cover{aspect-ratio:2/3;width:100%;object-fit:cover;display:block;background:var(--line)}
.gen-cover{aspect-ratio:2/3;width:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px;color:#fff;font-family:Fraunces,serif}
.gen-cover .gt{font-size:18px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.gen-cover .ga{font-size:12px;opacity:.9;font-family:Inter,sans-serif}
.cover-wrap{position:relative}
.upcoming-tag{position:absolute;top:8px;left:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.book .meta{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px}
.book .title{font-weight:600;line-height:1.25}
.book .author{font-size:13px;color:var(--muted)}
.book .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px}
.stars{position:relative;display:inline-block;font-size:15px;letter-spacing:1px;line-height:1}
.stars .bg{color:var(--line)} .stars .fg{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:var(--star)}
.stars.lg{font-size:26px}
.small{font-size:12px;color:var(--muted)}
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:600;flex:none}
.empty{text-align:center;padding:36px 16px;color:var(--muted)} .empty .e-ico{font-size:44px;margin-bottom:6px}

/* ---------- Members ---------- */
.members{display:flex;flex-direction:column;gap:10px}
.member{background:var(--card);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.member .info{flex:1;min-width:0} .member .name{font-weight:600}
.member .bars{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap;margin-top:2px}
.add-row{display:flex;gap:8px;margin-top:12px}
.turn-badge{background:var(--green);color:#fff;font-size:11px;padding:1px 8px;border-radius:999px;margin-left:6px;font-weight:600}

/* ---------- Buttons & forms ---------- */
.fab{position:fixed;right:18px;bottom:22px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;font-size:15px;box-shadow:0 6px 20px rgba(181,83,47,.4);cursor:pointer;z-index:5}
.btn{border:0;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--line);color:var(--ink)} .btn.danger{background:#b3261e;color:#fff} .btn.green{background:var(--green);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea,.input{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Book search (autofill) ---------- */
.lookup{background:var(--green-soft);border-radius:14px;padding:12px;margin-bottom:14px}
.lookup-row{display:flex;gap:8px}
.results{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:320px;overflow-y:auto}
.result{display:flex;gap:10px;align-items:center;background:var(--card);border:0;border-radius:10px;padding:6px;text-align:left;cursor:pointer}
.result img,.result .noimg{width:40px;height:60px;object-fit:cover;border-radius:4px;background:var(--line);flex:none}
.result .rt{font-weight:600;line-height:1.2} .result .ra{font-size:12px;color:var(--muted)}

/* ---------- Sheets / modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,14,10,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px 28px;animation:up .2s ease-out}
@media (min-width:700px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:8px;margin-bottom:12px} .sheet-head h2{flex:1;font-size:21px}
.detail-top{display:flex;gap:14px;margin-bottom:14px}
.detail-top .cv{width:110px;flex:none;border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.detail-top h2{font-size:22px;margin-bottom:2px}
.tag{display:inline-block;background:var(--green-soft);color:var(--green);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.facts{display:grid;gap:6px;font-size:14px;margin-top:8px} .facts div{display:flex;gap:8px;align-items:center}
.score-box{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:14px}
.score-box .avg{font-family:Fraunces,serif;font-size:38px;font-weight:700;line-height:1}
.rec-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px} .rec-bar span{display:block;height:100%;background:var(--green)}
.section{margin-top:18px} .section h3{font-size:17px;margin-bottom:8px}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--paper);border-radius:12px} .ritem .nm{flex:1;font-weight:500}
.quote{background:var(--paper);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:10px 12px;margin-bottom:8px;position:relative}
.quote p{margin:0 0 6px;font-family:Fraunces,serif;font-size:16px;white-space:pre-wrap} .quote .del{position:absolute;top:4px;right:4px}
.panel{background:var(--paper);border-radius:14px;padding:12px;margin-top:10px}
.slider-row{display:flex;align-items:center;gap:12px;margin:6px 0 10px}
.slider-row input{flex:1;accent-color:var(--star)}
.slider-row .val{font-family:Fraunces,serif;font-size:24px;font-weight:700;width:42px;text-align:right}
.toggle{display:flex;gap:6px;margin-bottom:10px}
.toggle button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font-weight:500}
.toggle button.on.yes{background:var(--green);color:#fff;border-color:var(--green)}
.toggle button.on.no{background:#8a3b2c;color:#fff;border-color:#8a3b2c}
.cover-pick{display:flex;gap:12px;align-items:center}
.cover-pick .pv{width:70px;border-radius:8px;overflow:hidden;flex:none;background:var(--line)}
.book .gen-cover{padding-top:36px}
.file-lbl{text-transform:none!important;letter-spacing:0!important;font-size:14px!important;color:var(--ink)!important;display:inline-block;border:1px dashed var(--muted);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:500}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:90vw}
</style>
</head>
<body>

<!-- ======== Passcode screen ======== -->
<div id="gate" class="gate hidden">
  <form class="gate-card" id="gateForm">
    <div style="font-size:44px">📚</div>
    <h1 id="gateTitle">Book Club 📖🤓</h1>
    <p>Enter the club passcode</p>
    <input class="input" id="gateCode" autocomplete="off" autocapitalize="none" placeholder="Passcode" style="text-align:center">
    <div class="err" id="gateErr"></div>
    <button class="btn" style="width:100%;margin-top:6px">Open</button>
  </form>
</div>

<!-- ======== Main app ======== -->
<div id="app" class="hidden">
<div class="wrap">
  <header>
    <h1 id="clubName">Book Club</h1>
    <button class="icon-btn" id="renameClub" aria-label="Club settings" title="Club settings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.85 1 1.51 1H21a2 2 0 1 1 0 4h-.09c-.66 0-1.25.4-1.51 1z"/>
      </svg>
    </button>
  </header>
  <div id="status" class="status hidden"></div>

  <div class="hero">
    <div class="hero-card meet" id="meetCard">
      <div class="hero-ico" id="meetIco"></div>
      <div style="min-width:0;flex:1"><div class="lbl" id="meetLbl">Next meeting</div><div class="big" id="meetTitle">Nothing booked</div><div class="sub" id="meetSub"></div>
        <button class="upnext hidden" id="meetNext" type="button"></button></div>
    </div>
    <div class="hero-card turn">
      <div class="hero-ico" id="turnAv">🎲</div>
      <div style="min-width:0"><div class="lbl">Next to choose</div><div class="big" id="turnName">—</div><div class="mini-btns" id="turnBtns"></div></div>
    </div>
  </div>

  <div class="tabs"><button id="tabBooks" class="on">📖 Book log</button><button id="tabMembers">👥 Members</button></div>

  <section id="booksView">
    <div class="stats" id="stats"></div>
    <input class="search" id="search" placeholder="Search title, author or chooser…">
    <div class="toolbar">
      <span class="small">Sort</span>
      <select id="sortBy" class="sort-sel">
        <option value="date">Club date</option><option value="title">Title</option><option value="author">Author</option>
        <option value="chooser">Chosen by</option><option value="score">Score</option><option value="rec">Recommended</option>
      </select>
      <button class="chip-btn" id="sortDir" aria-label="Reverse order">↓</button>
      <span style="flex:1"></span>
      <div class="view-toggle"><button data-view="grid" aria-label="Grid view">▦ Grid</button><button data-view="list" aria-label="List view">☰ List</button></div>
    </div>
    <div class="genres" id="genreChips"></div>
    <div class="grid" id="grid"></div>
    <div class="list hidden" id="list"></div>
    <div class="empty hidden" id="booksEmpty"><div class="e-ico">📕</div><div id="booksEmptyTxt"></div></div>
  </section>

  <section id="membersView" class="hidden">
    <div class="members" id="memberList"></div>
    <div class="add-row"><input class="input" id="newMember" placeholder="Add a member's name" maxlength="40"><button class="btn" id="addMember">Add</button></div>
    <p class="small" style="margin-top:10px">The turn to choose goes round in this order. Use the arrows to reorder.</p>
  </section>
</div>
<button class="fab" id="fab">＋ Add book</button>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =====================================================================
   CONFIG — Supabase project. These keys are safe to be public: the
   database only answers requests that carry the right club passcode.

// If that fails for any reason, keep the original so saving a book never breaks.
async function storeCover(src){
  if (!src || src.startsWith(STORED_COVERS)) return src;
  try {
    const { data, error } = await sb.functions.invoke("save-cover", { body: { source: src }, headers: { "x-club-code": clubCode } });
    if (error || !data?.url) throw error || new Error("no url");
    return data.url;
  } catch(e){ console.warn("Cover not stored, keeping original", e); return src; }
}
// Quietly move any covers that aren't stored yet (runs once per visit, a few at a time).
async function migrateCovers(){
  const todo = S.books.filter(b => b.cover && !b.cover.startsWith(STORED_COVERS)).slice(0, 15);
  let changed = false;
  for (const b of todo){
    const url = await storeCover(b.cover);
    if (url !== b.cover){ const { error } = await sb.from("books").update({ cover: url }).eq("id", b.id); if (!error) changed = true; }

}

function sortedBooks(field = S.sort, dir = S.dir){
  const val = b => {
    if (field === "date") return b.meet_date || null;
    if (field === "title") return (b.title || "").toLowerCase();
    if (field === "author") { const a = (b.author || "").split(",")[0].trim(); return a ? (a.split(" ").pop() + " " + a).toLowerCase() : null; } // by surname
    if (field === "chooser") return member(b.chooser_id) ? mName(b.chooser_id).toLowerCase() : null;
    const s = bookStats(b.id);
    if (field === "score") return s.count ? s.avg : null;
    if (field === "rec") return s.recAns ? s.recYes / s.recAns : null;
  };
  const sign = dir === "asc" ? 1 : -1;
  return [...S.books].sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === null && y === null) return b.created_at.localeCompare(a.created_at);
    if (x === null) return 1; if (y === null) return -1;
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return c * sign || b.created_at.localeCompare(a.created_at);
  });
}

function turnInfo(){

  const byClubDate = (a, b) => (b.meet_date || "").localeCompare(a.meet_date || "") || b.created_at.localeCompare(a.created_at);
  const latest = [...S.books].filter(b => ms.some(m => m.id === b.chooser_id)).sort(byClubDate)[0];
  // A manual "Change" sticks until a newer book (by club date) is added after it.
  const o = S.club, anchorAt = latest ? latest.created_at : "";
  if (o.turn_override_member && o.turn_override_at && new Date(o.turn_override_at) > new Date(anchorAt || 0) && ms.some(m => m.id === o.turn_override_member))
    return { m: member(o.turn_override_member), override: true };

  return { m: ms[(ms.findIndex(m => m.id === latest.chooser_id) + 1) % ms.length] };
}

// Pop-ups (book details, forms, menus) each add a step to the browser history,
// so the phone's back button / gesture closes the pop-up instead of leaving the app.
const modalStack = [];
function dismissModal(entry){
  const i = modalStack.indexOf(entry); if (i >= 0) modalStack.splice(i, 1);
  if (entry.ov.isConnected){ entry.ov.remove(); entry.onClose && entry.onClose(); }
  entry.waiting.splice(0).forEach(r => r());
}
window.addEventListener("popstate", () => {
  // Close the pop-up we asked to close, or (back button) the top one
  const closing = modalStack.filter(e => e.closing);
  const target = closing.length ? closing[closing.length - 1] : modalStack[modalStack.length - 1];
  if (target) dismissModal(target);
});
function openModal(html, onClose){
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const entry = { ov, onClose, closing: false, waiting: [] };
  // close() returns a promise that resolves once the pop-up has gone
  const close = () => new Promise(res => {
    if (!ov.isConnected) return res();
    entry.waiting.push(res);
    if (entry.closing) return;
    entry.closing = true;
    history.back();                                                       // popstate then removes it
    setTimeout(() => { if (ov.isConnected) dismissModal(entry); }, 1500); // safety net
  });
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) close(); });
  $("#modalRoot").appendChild(ov);
  modalStack.push(entry);
  history.pushState({ bcModal: modalStack.length }, "");
  return { el: ov.querySelector(".sheet"), close };
}
function confirmBox(msg, ok = "Delete"){

  });
}
function promptBox(title, value = ""){

}

/* =====================================================================
   BOOK SEARCH — Google Books + Open Library, searched together.
   Google is better for new releases; Open Library often has bigger covers.
   ===================================================================== */
async function searchBooks(q){
  const [g, o] = await Promise.allSettled([searchGoogle(q), searchOpenLibrary(q)]);
  if (g.status === "rejected" && o.status === "rejected") throw new Error("search failed");
  const merged = new Map();
  const key = r => (r.title + "|" + r.author.split(",")[0]).toLowerCase().replace(/[^a-z0-9|]/g, "");
  for (const r of g.status === "fulfilled" ? g.value : []) if (!merged.has(key(r))) merged.set(key(r), r);
  for (const r of o.status === "fulfilled" ? o.value : []){
    const k = key(r), hit = merged.get(k);
    if (!hit) merged.set(k, r);
    else {
      if (r.cover) { hit.cover = r.cover; hit.thumb = hit.thumb || r.thumb; }   // prefer Open Library's larger cover
      hit.genres = [...new Set([...hit.genres, ...r.genres])].slice(0, 3);
    }
  }
  return [...merged.values()].slice(0, 12);
}
async function searchGoogle(q){
  const url = "https://www.googleapis.com/books/v1/volumes?maxResults=10&printType=books&q=" + encodeURIComponent(q)
    + (GOOGLE_BOOKS_KEY ? "&key=" + GOOGLE_BOOKS_KEY : "");
  const r = await fetch(url); if (!r.ok) throw new Error("google search failed");
  const j = await r.json();
  return (j.items || []).map(v => {
    const i = v.volumeInfo || {};
    const img = (i.imageLinks?.thumbnail || i.imageLinks?.smallThumbnail || "").replace(/^http:/, "https:").replace("&edge=curl", "");
    const ids = i.industryIdentifiers || [];
    return { title: i.title || "", author: (i.authors || []).slice(0, 2).join(", "),
      year: (i.publishedDate || "").slice(0, 4), isbn: (ids.find(x => x.type === "ISBN_13") || ids[0] || {}).identifier || "",
      cover: img, thumb: img, genres: guessGenres(i.categories || []) };
  }).filter(r => r.title);
}
async function searchOpenLibrary(q){
  const url = "https://openlibrary.org/search.json?limit=10&fields=key,title,author_name,cover_i,first_publish_year,subject,isbn&q=" + encodeURIComponent(q);
  const r = await fetch(url); if (!r.ok) throw new Error("search failed");
  const j = await r.json();
  return (j.docs || []).map(d => ({
    title: d.title || "", author: (d.author_name || []).slice(0, 2).join(", "),
    year: d.first_publish_year || "", isbn: (d.isbn || [])[0] || "",
    cover: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg` : "",
    thumb: d.cover_i ? `https://covers.openlibrary.org/b/id/${d.cover_i}-S.jpg` : "",
    genres: guessGenres(d.subject || [])
  }));
}
// Database subjects are messy — map them to up to 3 tidy genres (you can change them before saving).
function guessGenres(subjects){
  const s = subjects.join(" | ").toLowerCase();
  const rules = [["Fantasy",/fantasy|magic|dragons/],["Sci-fi",/science fiction|dystopia/],["Crime",/crime|detective|police/],["Thriller",/thriller|suspense/],
    ["Mystery",/mystery/],["Horror",/horror|ghost|vampire/],["Romance",/romance|love stories/],["Historical fiction",/historical fiction/],
    ["Young adult",/young adult|juvenile fiction/],["Humour",/humor|humour|comedy/],["Classic",/classic/],["Poetry",/poetry/],
    ["Biography / Memoir",/biography|memoir|autobiography/]];
  const hits = rules.filter(([, re]) => re.test(s)).map(([g]) => g).slice(0, 3);
  if (!hits.length && /fiction/.test(s)) hits.push("Fiction");
  if (!hits.length && /history|science|politics|economics|psychology|nonfiction|non-fiction/.test(s)) hits.push("Non-fiction");
  return hits;
}

/* =====================================================================
   PHOTO UPLOAD — shrink to a small JPEG and store it in the database
   ===================================================================== */
function fileToCover(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 300 / img.width, 450 / img.height);
      const c = document.createElement("canvas"); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg", .78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

// Build a spreadsheet (CSV) of the whole log and download it.
function exportCSV(){
  const cell = v => { const s = v === null || v === undefined ? "" : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  // one score column per member who's in the club or has ever scored
  const scorers = [...activeMembers(), ...S.members.filter(m => !m.active && S.ratings.some(r => r.member_id === m.id))];
  const head = ["Title","Author","Genres","Chosen by","Club date","Time","Location","Average score","Number of scores","Recommended (yes / answered)",
    ...scorers.map(m => m.name + " score"), ...scorers.map(m => m.name + " recommends?"), "Quotes"];
  const rows = sortedBooks("date", "desc").map(b => {
    const s = bookStats(b.id);
    const mine = id => S.ratings.find(r => r.book_id === b.id && r.member_id === id);
    const quotes = S.quotes.filter(q => q.book_id === b.id).sort((a, c) => a.created_at.localeCompare(c.created_at))
      .map(q => `"${q.text}" — ${mName(q.member_id)}${q.page ? ", p." + q.page : ""}`).join("  |  ");
    return [b.title, b.author, bookGenres(b).join(", "), mName(b.chooser_id), b.meet_date, b.meet_time, b.location,
      s.count ? s.avg.toFixed(1) : "", s.count || "", s.recAns ? `${s.recYes} / ${s.recAns}` : "",
      ...scorers.map(m => mine(m.id)?.score ?? ""), ...scorers.map(m => { const r = mine(m.id); return r ? (r.recommend === true ? "Yes" : r.recommend === false ? "No" : "") : ""; }),
      quotes];
  });
  const csv = "\uFEFF" + [head, ...rows].map(r => r.map(cell).join(",")).join("\r\n");   // \uFEFF keeps emojis/accents right in Excel
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = `${(S.club.name || "book-club").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "book-club"}-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  toast("Spreadsheet downloaded ⬇️");
}

document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { S.view = b.dataset.view; store.set("bc_view", S.view); renderBooks(); });
$("#list").onclick = e => { const b = e.target.closest("[data-book]"); if (b) openBook(b.dataset.book); };
const setTurn = id => write(() => sb.from("club").update({ turn_override_member: id, turn_override_at: new Date().toISOString() }).eq("id", 1));
$("#turnBtns").onclick = e => {
  const a = e.target.closest("[data-act]"); const ti = turnInfo(); if (!a || !ti) return; const ms = activeMembers();
  const m = openModal(`<h2 style="font-size:19px;margin-bottom:10px">Whose turn is it?</h2><div class="rlist">${ms.map(x => `<button class="ritem" style="border:0;cursor:pointer" data-pick="${x.id}">${avatar(x.id, 28)}<span class="nm" style="text-align:left">${esc(x.name)}</span></button>`).join("")}</div>
    <div class="actions" style="margin-top:12px"><button class="btn alt" data-close>Cancel</button></div>`);
  m.el.onclick = ev => { const p = ev.target.closest("[data-pick]"); if (p){ setTurn(p.dataset.pick); m.close(); } };
};
async function addMember(){
  const inp = $("#newMember"), n = inp.value.trim(); if (!n) return;
  if (activeMembers().some(m => m.name.toLowerCase() === n.toLowerCase())){ toast(n + " is already a member."); return; }
  const order = Math.max(0, ...S.members.map(m => m.sort_order)) + 1;
  if (await write(() => sb.from("members").insert({ name: n, sort_order: order }))){ inp.value = ""; inp.focus(); }
}
$("#addMember").onclick = addMember;
$("#newMember").onkeydown = e => { if (e.key === "Enter") addMember(); };
$("#memberList").onclick = async e => {
  const t = e.target.closest("button"); if (!t) return; const ms = activeMembers();
  // Swap two members, then save everyone's position as 0, 1, 2…
  const swap = (i, j) => write(async () => {
    const order = [...ms]; [order[i], order[j]] = [order[j], order[i]];
    for (let k = 0; k < order.length; k++){
      if (order[k].sort_order === k) continue;
      const r = await sb.from("members").update({ sort_order: k }).eq("id", order[k].id); if (r.error) return r;
    }
    return { error: null };
  });
  if (t.dataset.mup) { const i = +t.dataset.mup; swap(i, i - 1); }
  else if (t.dataset.mdown) { const i = +t.dataset.mdown; swap(i, i + 1); }
  else if (t.dataset.medit){ const m = member(t.dataset.medit); const v = await promptBox("Rename member", m.name); if (v) write(() => sb.from("members").update({ name: v }).eq("id", m.id)); }
  else if (t.dataset.mdel){ const m = member(t.dataset.mdel);
    // "Remove" hides the member but keeps their past picks, scores and quotes in the log.
    if (await confirmBox(`Remove ${m.name} from the club? Their past picks, scores and quotes stay in the log.`, "Remove")) write(() => sb.from("members").update({ active: false }).eq("id", m.id)); }
};

/* =====================================================================
   START-UP — passcode, first load, background refresh
   ===================================================================== */
async function start(code){
  sb = makeClient(code); clubCode = code;
  // remember each person's view & sort choice on their own phone
  S.view = store.get("bc_view") === "list" ? "list" : "grid";
  S.sort = DEFAULT_DIR[store.get("bc_sort")] ? store.get("bc_sort") : "date";
  S.dir = ["asc", "desc"].includes(store.get("bc_dir")) ? store.get("bc_dir") : DEFAULT_DIR[S.sort];
  $("#gate").classList.add("hidden"); $("#app").classList.remove("hidden");
  status("Loading your book club…");
  await refresh();
  if (!activeMembers().length){ S.tab = "members"; render(); }
  migrateCovers();
  setInterval(() => { if (document.visibilityState === "visible" && !S.openBook) refresh(); }, REFRESH_SECONDS * 1000);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
}
$("#gateForm").onsubmit = async e => {
  e.preventDefault(); const code = $("#gateCode").value.trim(); if (!code) return;
  $("#gateErr").textContent = "Checking…";
  try {
    if (await checkCode(code)){ store.set("bc_code", code); $("#gateErr").textContent = ""; start(code); }
    else $("#gateErr").textContent = "That passcode isn't right.";
  } catch(err){ $("#gateErr").textContent = "Can't connect right now — try again in a moment."; }
};
// Save covers on the phone after first load (needs sw.js uploaded next to this file).
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn("Cover saving unavailable:", e));
}
(async () => {
  if (store.get("bc_name")) $("#gateTitle").textContent = store.get("bc_name");
  const saved = store.get("bc_code");
  if (saved){ try { if (await checkCode(saved)) return start(saved); } catch(e){ return start(saved); } store.del("bc_code"); }
  $("#gate").classList.remove("hidden"); $("#gateCode").focus();
})();
</script>
